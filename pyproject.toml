[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rio-discord-bot"
version = "0.1.0"
description = "Rio roleplay Discord bot with isolated persistent memory and multi-provider LLM support"
requires-python = ">=3.11"
dependencies = ["discord.py>=2.7,<3", "openai>=1.68,<3", "python-dotenv>=1.0,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "httpx>=0.27,<1"]

[project.scripts]
rio-bot = "rio_bot.discord.runtime_entry:main"
rio-lore = "rio_bot.tooling.lore_cli:main"
rio-eval = "rio_bot.tooling.eval_runner:main"
rio-routing-eval = "rio_bot.tooling.routing_eval:main"
rio-dashboard = "rio_bot.tooling.dashboard:main"
rio-migrate-runtime = "rio_bot.core.runtime_migration:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rio_bot = ["prompts/*.md", "data/*.jsonl"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# These files intentionally exercise legacy flat import aliases while compatibility is retained.
"scripts/run_prompt_injection_eval.py" = ["I001"]
"tests/ai/test_chat_web_search.py" = ["I001"]
"tests/ai/test_usage.py" = ["I001"]
"tests/core/test_lore.py" = ["I001"]
"tests/discord/test_slash_commands.py" = ["I001"]
"tests/tooling/test_lore_cli.py" = ["I001"]
"tests/tooling/test_lore_web.py" = ["I001"]
